name: GBR Pages v5.21

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gbr-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Good Boy Records
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact project location
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/good-boy-records"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/tools/import_showcase.py"
          test -f "$PROJECT_DIR/tools/prepare_artwork.py"
          test -f "$PROJECT_DIR/tools/build_catalogue.py"
          test -f "$PROJECT_DIR/tools/check_links.py"
          test -f "$PROJECT_DIR/tools/stage_pages.py"

          echo "=== PROJECT ==="
          pwd
          echo "$PROJECT_DIR"

          echo "=== SHOWCASE ==="
          find "$PROJECT_DIR/showcase" -maxdepth 2 -type f | sort

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GBR build dependencies - NO requirements.txt
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML>=6.0" "Pillow>=10.0"

      - name: Clean generated output
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          rm -rf _site music

      - name: Import curated showcase
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/import_showcase.py

      - name: Prepare artwork
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/prepare_artwork.py masters assets/img/sleeves

      - name: Build cassette catalogue
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/build_catalogue.py

      - name: Check internal links
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/check_links.py

      - name: Stage Pages runtime
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/stage_pages.py

          test -f _site/index.html

          if [ -d _site/music ]; then
            echo "ERROR: legacy music directory reached the Pages artifact"
            exit 1
          fi

          echo "=== STAGED SITE ==="
          du -sh _site
          find _site -maxdepth 3 -type f | sort | head -400

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: good-boy-records/_site

  deploy:
    name: Deploy Good Boy Records
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
