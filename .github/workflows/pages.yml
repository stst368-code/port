name: Build and deploy Good Boy Records

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate Good Boy Records
        shell: bash
        run: |
          MATCH="$(find . -type f -path '*/tools/import_showcase.py' -print -quit)"

          if [ -z "$MATCH" ]; then
            echo "ERROR: Could not find tools/import_showcase.py"
            echo
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$MATCH")")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Good Boy Records at: $PROJECT_DIR"
          echo
          ls -la "$PROJECT_DIR"

      - name: Install build dependencies
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/requirements.txt" ]; then
            python -m pip install -r "$PROJECT_DIR/requirements.txt"
          else
            echo "requirements.txt not found - installing required packages directly"
            python -m pip install PyYAML Pillow
          fi

      - name: Import showcase
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/import_showcase.py

      - name: Build artwork
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/prepare_artwork.py masters assets/img/sleeves

      - name: Build catalogue and pages
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/build_catalogue.py

      - name: Check internal links
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/check_links.py

      - name: Stage GitHub Pages site
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python tools/stage_pages.py

          rm -rf "$GITHUB_WORKSPACE/_site_deploy"
          cp -a _site "$GITHUB_WORKSPACE/_site_deploy"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
