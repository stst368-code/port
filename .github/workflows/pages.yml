name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Import deliberately selected showcase files
        run: python tools/import_showcase.py

      - name: Rebuild artwork derivatives
        run: python tools/prepare_artwork.py masters assets/img/sleeves

      # A broken track definition fails here rather than reaching a visitor.
      # Warnings are allowed on main: a track with lyrics but no CFG number is
      # incomplete, not broken. Add --strict once the catalogue is written up.
      - name: Build catalogue and pages
        run: python tools/build_catalogue.py

      - name: Check every internal link resolves
        run: python tools/check_links.py

      - name: Stage runtime site and enforce Pages size limits
        run: python tools/stage_pages.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Runtime only. Hand-picked FLACs are copied from showcase/ into
          # assets/audio during the build; source YAML and build tooling are not
          # included in the published Pages artifact.
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
