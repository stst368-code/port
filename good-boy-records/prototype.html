<template id="gbr-page-template-about">
<p>Good Boy Records is run out of a converted mill in Derbyshire by two golden retrievers with strong opinions about seating arrangements and a passion for chasing balls beyond the gate.</p>
<p>Each cassette on the wall is one generated take. Songs usually have several versions; they sit together in the magazine so you can hear how a track changed between attempts, models or styles.</p>
<p>This page documents how the music is made and acts as a general introduction to AI, generative models and diffusion.</p>
<p>Whilst we are two good dogs, we do have to warn you: some songs, and some of the songs linked from this page, contain explicit language or cover subject matter that may offend.</p>
<p>Please don&#x27;t play this around your children.</p>
</template>
<template id="gbr-page-template-origin">
<p>I&#x27;ve always enjoyed covers, especially when someone completely changes the style or language of the original.</p>
<p>Through the magic of YouTube recommendations, I came across AI covers in 2024. They were quite bad, but very entertaining.</p>
<p>I&#x27;ve kept my eyes and ears open as the technology and the processes have developed, and with some confidence I can state that what you see here at Good Boy Records is the cutting edge of what&#x27;s available at the time of writing this (Sept. 2026).</p>
<p>I can equally, confidently, state that six months from now this will look like a dog playing a recorder, so enjoy it whilst it&#x27;s good.</p>
<p>For some frame of reference, here are a few AI cover artists and tracks I thought were doing this particularly well before I started building my own:</p>
<div class="gbr-demo-widget"><span class="gbr-demo-widget__lamp"></span><strong>SPOTIFY EMBED</strong><span>https://open.spotify.com/playlist/2goJQmLGvz08hNlQqse7FC</span></div>
<p>And, whilst not AI, on the theme of covers, I have to give a shout to Scott:</p>
<div class="gbr-demo-widget"><span class="gbr-demo-widget__lamp"></span><strong>SPOTIFY EMBED</strong><span>https://open.spotify.com/artist/5HYNPEO2NNBONQkp3Mvwvc</span></div>
</template>
