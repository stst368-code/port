name: GBR Pages v6

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "gbr-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify project
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/good-boy-records"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/tools/import_showcase.py"
          test -f "$PROJECT_DIR/tools/build_catalogue.py"
          find "$PROJECT_DIR/showcase" -maxdepth 2 -type f | sort

      - name: Install build dependencies
        run: python -m pip install "PyYAML>=6.0" "Pillow>=10.0"

      - name: Clean generated output
        shell: bash
        run: rm -rf "$PROJECT_DIR/_site" "$PROJECT_DIR/music"

      - name: Import curated showcase
        shell: bash
        run: cd "$PROJECT_DIR" && python tools/import_showcase.py

      - name: Prepare artwork
        shell: bash
        run: cd "$PROJECT_DIR" && python tools/prepare_artwork.py masters assets/img/sleeves

      - name: Build catalogue
        shell: bash
        run: cd "$PROJECT_DIR" && python tools/build_catalogue.py

      - name: Test player structure
        shell: bash
        run: cd "$PROJECT_DIR" && python tools/test_player.py

      - name: Check internal links
        shell: bash
        run: cd "$PROJECT_DIR" && python tools/check_links.py

      - name: Stage Pages
        shell: bash
        run: cd "$PROJECT_DIR" && python tools/stage_pages.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: good-boy-records/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
