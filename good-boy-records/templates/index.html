<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Good Boy Records</title>
<meta name="description" content="Good Boy Records cassette player">
<link rel="stylesheet" href="{{ROOT}}assets/css/v6.css">
</head>
<body>
<main class="gbr-app">
  <header class="gbr-topbar">
    <span class="gbr-brand">GOOD BOY RECORDS</span>
    <div class="gbr-top-actions">
      <span class="gbr-status" id="gbr-status">READY</span>
      <button class="gbr-top-button" id="gbr-eq-toggle" type="button" aria-expanded="false" aria-controls="gbr-eq-popover">EQ</button>
      <button class="gbr-top-button" id="gbr-tech-toggle" type="button" aria-expanded="false" aria-controls="gbr-tech-panel">TECH</button>
    </div>
  </header>

  <section class="gbr-machine" aria-label="Good Boy Records player">
    <div class="gbr-carousel-viewport" aria-label="Cassette carousel">
      <div class="gbr-carousel" id="gbr-carousel" tabindex="0" role="region" aria-label="Rotary cassette carousel">
        <div class="gbr-carousel-ring" aria-hidden="true"></div>
        <div class="gbr-carousel-hub" aria-hidden="true"></div>
        <div class="gbr-carousel-cards" id="gbr-carousel-cards">
{{SHELF}}
        </div>
      </div>
      <button class="gbr-wheel-step gbr-wheel-step--up" type="button" id="gbr-prev" aria-label="Previous cassette">▲</button>
      <button class="gbr-wheel-step gbr-wheel-step--down" type="button" id="gbr-next" aria-label="Next cassette">▼</button>
    </div>

    <div class="gbr-rack">
      <section class="gbr-module gbr-spectrum-module" aria-label="Audio spectrum">
        <div class="gbr-module-label"><span>PROGRAM SPECTRUM</span><span>POST EQ</span></div>
        <div class="gbr-spectrum" id="gbr-spectrum" aria-hidden="true"></div>
      </section>

      <section class="gbr-module gbr-art-module" aria-label="Current artwork">
        <div class="gbr-art-frame" id="gbr-art-frame">
          <img id="gbr-artwork" src="{{ROOT}}assets/img/sleeves/gbr-placeholder-640.jpg" alt="Current album artwork">
          <div class="gbr-tape-slot" id="gbr-tape-slot" aria-hidden="true"><span></span></div>
        </div>
      </section>

      <section class="gbr-module gbr-controls" aria-label="Playback controls">
        <div class="gbr-control-row">
          <button type="button" class="gbr-control" id="gbr-shuffle" aria-label="Shuffle play" aria-pressed="true" title="Shuffle play">⤨</button>
          <button type="button" class="gbr-control" id="gbr-back" aria-label="Previous cassette" title="Previous cassette">◀</button>
          <button type="button" class="gbr-control gbr-control--main" id="gbr-play" aria-label="Play or pause">▶</button>
          <button type="button" class="gbr-control" id="gbr-skip" aria-label="Next cassette" title="Next cassette">▶</button>
        </div>
        <div class="gbr-progress-row">
          <span class="gbr-clock"><span id="gbr-time">0:00</span><b>/</b><span id="gbr-total">--:--</span></span>
          <input id="gbr-progress" type="range" min="0" max="0" value="0" step="0.1" aria-label="Track progress">
        </div>
        <div class="gbr-volume-row">
          <span>OUTPUT</span>
          <input id="gbr-volume" type="range" min="0" max="1" value="0.9" step="0.01" aria-label="Volume">
          <label class="gbr-lossless" id="gbr-lossless-wrap"><input id="gbr-lossless" type="checkbox"><span>LOSSLESS</span></label>
        </div>
      </section>

      <section class="gbr-module gbr-lyrics" id="gbr-lyrics" aria-label="Current lyric">
        <div class="gbr-lyric-word" id="gbr-lyric-word">READY</div>
        <div class="gbr-lyric-line" id="gbr-lyric-line"></div>
      </section>
    </div>
  </section>

  <div class="gbr-popover" id="gbr-eq-popover" hidden>
    <section class="gbr-popup-card" role="dialog" aria-modal="false" aria-label="Five band equalizer">
      <div class="gbr-popup-head"><strong>5-BAND PROGRAM EQ</strong><button type="button" id="gbr-eq-close" aria-label="Close equalizer">×</button></div>
      <div class="gbr-eq-bands">
        <label><output>0 dB</output><input data-eq-frequency="60" type="range" min="-9" max="9" step="1" value="0"><span>60</span></label>
        <label><output>0 dB</output><input data-eq-frequency="250" type="range" min="-9" max="9" step="1" value="0"><span>250</span></label>
        <label><output>0 dB</output><input data-eq-frequency="1000" type="range" min="-9" max="9" step="1" value="0"><span>1K</span></label>
        <label><output>0 dB</output><input data-eq-frequency="4000" type="range" min="-9" max="9" step="1" value="0"><span>4K</span></label>
        <label><output>0 dB</output><input data-eq-frequency="12000" type="range" min="-9" max="9" step="1" value="0"><span>12K</span></label>
      </div>
      <div class="gbr-popup-foot"><button type="button" id="gbr-eq-flat">FLAT</button><span id="gbr-eq-note">EQ is applied live over HTTP.</span></div>
    </section>
  </div>

  <aside class="gbr-tech-panel" id="gbr-tech-panel" hidden aria-label="Track technical details">
    <div class="gbr-popup-head"><strong>TECHNICAL</strong><button type="button" id="gbr-tech-close" aria-label="Close technical details">×</button></div>
    <div id="gbr-tech-content" class="gbr-tech-content"><p>No cassette loaded.</p></div>
  </aside>

  <audio id="gbr-audio" preload="metadata"></audio>
</main>
<script id="catalogue-data" type="application/json">{{CATALOGUE_JSON}}</script>
<script src="{{ROOT}}assets/js/v6.js" defer></script>
</body>
</html>
