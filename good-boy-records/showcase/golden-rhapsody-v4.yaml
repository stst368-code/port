caption: |
  ### Global Metadata

  **Basic Attributes:** 1970s British operatic progressive rock in the direct musical tradition of “Bohemian Rhapsody.” A through-composed rock rhapsody made from sharply contrasting movements, not a repeating verse-chorus song. No single global tempo, metre or tonal centre. Intro is free and rubato; piano-ballad sections sit around 70–75 BPM; the operatic movement changes tempo, metre and key frequently; the hard-rock movement drives around 135–145 BPM; the outro returns to a slow free tempo.

  **Global Emotional Progression:** Begin mysterious, exposed and solemn. Develop into a vulnerable piano confession that grows increasingly anguished and grand. Break completely from the ballad into an extravagant comic-opera movement filled with rapid vocal exchanges and theatrical tension. Explode suddenly into aggressive hard rock, then collapse into a resigned, reflective coda. Every movement must sound unmistakably different while recurring melodic fragments preserve continuity.

  **Sonics & Production Profile:** Lavish mid-1970s analogue studio production. Grand piano, melodic electric bass, live acoustic drums, orchestral percussion, layered electric guitars and immense multitracked male vocals. Wide dynamics, clear separation and deliberate studio theatricality. Avoid modern pop polish, fixed-tempo production, electronic drums, synthesizer-led arrangements, Auto-Tune, trap rhythms, muddy audio and continuous wall-of-sound density.

  ### Vocal Details

  **Vocal Gender & Timbre:** Singer A (Male), agile dramatic tenor with a rich lower register, clear diction, powerful sustained upper notes and theatrical character voices.

  **Vocal Style:** The intro uses exposed close harmony. Verses use intimate, emotionally escalating piano-ballad singing with flexible timing. Verse 3 becomes an exaggerated operatic performance with rapid switches between pleading, commanding, comic and ominous characters. The Bridge uses forceful, gritty rock vocals. The Outro returns to soft, weary restraint.

  **Harmony/Backing Vocals:** Dense multitracked male harmonies are essential. Use close chordal harmony in the Intro and enormous contrapuntal vocal stacks in Verse 3, including overlapping questions, answers, repeated words, register contrasts and sudden solo interruptions. Vocal layers must largely disappear during the Bridge and Outro.

  **Vocal FX:** Period studio compression, tape saturation and controlled plate ambience. No modern pitch-correction sound.

  ### Arrangement

  **Intro:** Unaccompanied stacked male vocals. Harmonically ambiguous, slow and rubato. Grand piano enters only near the transition.

  **Verse 1:** Sparse piano ballad with solo lead vocal. Bass enters gradually. No steady drum groove at first.

  **Verse 2:** Continue the ballad but increase emotional weight. Add full bass, restrained drums and distant electric-guitar colour. Build to a dramatic vocal peak and complete stop.

  **Solo:** Lyrical sustained electric-guitar solo over piano, bass and drums. It must function as a bridge into an entirely new movement, not conventional soloing over the verse chords.

  **Verse 3:** Abrupt comic-opera movement. Abandon the ballad groove completely. Use rapid key changes, shifting metre, stop-start piano, orchestral percussion, tiny character lines, huge stacked responses, sudden silences, accelerations and exaggerated cadences.

  **Bridge:** Instant hard-rock eruption. Heavy guitar riff, forceful acoustic drums, driving bass and confrontational lead vocal. Direct, aggressive and much less harmonically crowded than Verse 3.

  **Outro:** Hard cut back to slow piano-led reflection. Recall the opening melody, gradually remove the band, and finish quietly with a final resonant percussion strike.

  The tags represent separate musical movements. Do not reuse the same tempo, groove, melody or accompaniment across Verse 1, Verse 3 and Bridge.
