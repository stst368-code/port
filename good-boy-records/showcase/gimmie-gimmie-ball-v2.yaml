caption: |
  Genre 1970s Scandinavian disco-pop, strong similarity to the Swedish band ABBA. 110 to 125 BPM range. D minor target key, in 4/4 timing. Urgent minor-key verses, bright melodic chorus, and bittersweet nocturnal energy. Favour polished late-1970s studio production, with the mix and spatial character appropriate to the stated era.
  Vocals Base the lead and supporting vocal treatment on dramatic female lead vocals and rich stacked female harmonies. Keep lead, backing, choir, spoken, and character roles clearly separated, and use vocal effects only where they serve the stated style. 
  Arrangement Chorus Electronic violin decrescendo. Instrument lifecycle hypnotic analog synthesizer arpeggio, string ensemble, piano, melodic electric bass, tight four-on-the-floor disco drums, and crisp hi-hat should enter, recede, and return as one evolving arrangement rather than remain as a static stack. Shape transitions through changes in density, register, articulation, percussion, and ambience so the energy curve remains clearly audible. 
