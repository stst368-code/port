lyrics: |
  [Intro]
  (pitched-up) Woof, woof
  Yeah, it's Doja
  Bam Bam, get off the couch
  Ugh
  Let's go

  [Verse 1]
  I'm that golden girl, blonde hair, cold stare
  Walk in the room and you better beware
  I don't chase the ball, I make the ball chase me
  Princess of the house and the whole world's my pantry
  Scratch behind my ears? You can earn that, peasant
  Bring me a treat and maybe you'll be present
  Eyes like a sniper, posture like a queen
  Prettiest, pettiest golden you ever seen
  Opossum face if it don't go my way
  (yeah)
  Then here come Bam Bam, big dumb and golden
  Brain the size of a pea but his heart wide open
  One neuron firing and it only says "FETCH"
  Slobber on the floor, that's my Bam Bam, what a catch
  (Woof!)

  [Chorus]
  Golden girl, don't test me
  Run this whole house, you can't arrest me
  Pretty and petty, I do what I want
  Princess with the teeth, watch me flaunt
  (Woof!)
  Doja, Doja, run it
  Bam Bam, Bam Bam, golden
  Two of us, one throne
  Move, this whole house is my own
  (Woof!)

  [Verse 2]
  BALL! Did somebody say ball?
  I'm Bam Bam, I love everybody, that's all
  Big soft mouth, fit your neck inside it
  I'm not a threat, I'm just happy, can't hide it
  Rain or shine, I'm answering the call
  Wreckin' ball baby, bouncin' off the wall
  Love every human, love every friend
  Except Teddy (why?) nobody comprehend
  Fluff Teddy, fluff Teddy
  (Doja: ugh, focus)
  Heard "ready set go" and forgot my own name
  Stick me on repeat, I'll do it all again
  (Woof!)

  [Chorus]
  Golden girl, don't test me
  Run this whole house, you can't arrest me
  Pretty and petty, I do what I want
  Princess with the teeth, watch me flaunt
  (Woof!)
  Doja, Doja, run it
  Bam Bam, Bam Bam, golden
  Two of us, one throne
  Move, this whole house is my own
  (Woof!)

  [Bridge]
  Two sides of a golden, same heart underneath
  She's the brains and the beauty, he's the chaos and teeth
  One's a little gremlin, one's a slobber machine
  Prettiest, dumbest, sweetest team you've seen
  Doja! Bam Bam!
  One girl, one boy
  Same breed, different toy
  (Woof!)

  [Outro]
  Doja the princess, Bam Bam the chunk
  One holds it down, one's a golden drunk
  Two goldens, one home, we got it all
  Twenty twenty six, hear the golden call
  Go get that treat!
  Walk it on repeat!
  (Woof! Woof!)
  Ugh, I'm outside
  Bye
