caption: |
  Genre cinematic late-night trap, melodic auto-tuned drawl, spacious minimal arrangement, ominous pauses, and heavy low end. Approximately 125 BPM. E minor target key, in 4/4 timing. Dark hypnotic trap, haunting minor-key flute loop, and dark luxurious atmosphere, opening into nocturnal city mood. Lurching half-time groove should define the pocket and motion. Favour polished modern trap production and wide stereo ambience, with the mix and spatial character appropriate to the stated era.
  Vocals Base the lead and supporting vocal treatment on low relaxed male rap vocals, rhythmic mumble rap delivery, layered ad-libs, and whispered backing vocals. Keep lead, backing, choir, spoken, and character roles clearly separated, and use vocal effects only where they serve the stated style.
  Arrangement Follow the lyric-section timeline Intro → Verse 1 → Chorus → Verse 2 → Chorus → Bridge → Outro. Intro establish the palette with eerie atmospheric synth pads, deep booming 808 bass, sliding sub bass, and sparse piano accents and a restrained version of lurching half-time groove, leaving headroom for the first vocal entrance. Verses keep density controlled for lyrical clarity, anchoring the pocket with lurching half-time groove and adding instrumental colour selectively. Choruses: broaden the hook, vocal image, and rhythmic impact while keeping eerie atmospheric synth pads, deep booming 808 bass, sliding sub bass, and sparse piano accents as the recognisable core. Bridge: create real contrast by thinning or re-voicing the groove, then rebuild toward the final peak. Outro: resolve with a stylistically appropriate vamp, cadence, fade, or gradual subtraction of layers. Instrument lifecycle eerie atmospheric synth pads, deep booming 808 bass, sliding sub bass, sparse piano accents, crisp triplet hi-hats, rapid hi-hat rolls, and punchy trap snare should enter, recede, and return as one evolving arrangement rather than remain as a static stack. Shape transitions through changes in density, register, articulation, percussion, and ambience so the energy curve remains clearly audible. Explicit exclusions avoid drill, grime, reggaeton, EDM, house, dubstep, pop-rock, female lead vocals, acoustic band, live rock drums, bright major-key pop.
