caption: |
  Genre creepy dollhouse pop, music box melody, distant bells, warped nursery rhyme atmosphere, whimsical horror, unsettling innocence, and explosive anthemic chorus. Approximately 103 BPM. F minor target key, in 4/4 timing. Dark alternative pop, theatrical dark pop, and sarcastic childish attitude, opening into breathy intimate verses and eerie celesta. Favour vintage toy textures and cinematic production, with the mix and spatial character appropriate to the stated era.
  Vocals Base the lead and supporting vocal treatment on haunting female vocals, sweet but sinister vocal delivery, dramatic belted chorus, and layered female harmonies. Keep lead, backing, choir, spoken, and character roles clearly separated, and use vocal effects only where they serve the stated style.
  Arrangement Follow the lyric-section timeline Verse 1 → Pre-Chorus → Chorus → Verse 2 → Pre-Chorus → Chorus → Bridge → Instrumental → Chorus → Outro. Verse 1: Pause. Instrument lifecycle detuned toy piano, pizzicato strings, dark piano chords, deep bass, and punchy electronic drums should enter, recede, and return as one evolving arrangement rather than remain as a static stack. Shape transitions through changes in density, register, articulation, percussion, and ambience so the energy curve remains clearly audible. Explicit exclusions avoid children's music, literal nursery rhyme, musical theatre, Broadway, male lead vocals, cheerful bubblegum pop, EDM festival drop, conventional rock band, comedy novelty song. Keep melodic, harmonic, and rhythmic motifs recognisable across repeated sections, but vary orchestration and intensity enough that later returns feel developed rather than copied. Preserve natural dynamics and believable ensemble interaction, and let the arrangement breathe around the lead performance instead of filling every register continuously.
