caption: |
  Global Metadata
  Minimal mid-2010s alternative rap and spacey trap with an underground UK feel. Slow, heavy half-time bounce around 68–70 BPM, or approximately 136–140 BPM in double-time counting. Keep the production sparse, repetitive and hypnotic rather than constantly evolving: rounded sub-bass, dry punchy kick, tight snare, simple crisp hi-hats, restrained trap percussion and a small eerie synthetic motif repeating through most of the track. Harmony should remain minimal and loop-based, creating a slightly sinister but playful nocturnal atmosphere. The groove should feel relaxed and confident despite the fast vocal phrasing. Preserve substantial empty space around the vocal. Avoid hyperpop maximalism, glitch-heavy production, dramatic drops, dense synth layers, EDM effects, rock instrumentation and excessive transitional sound design.
  Vocal Details
  Female lead vocal with a youthful, bright, slightly nasal timbre and clear British-accented rap delivery. Performance is cheeky, dry, sexually provocative and self-assured rather than manic. Verses use tightly articulated conversational rap with quick internal rhymes and playful changes of emphasis, but maintain a steady underlying cadence. Pre-choruses become slightly more melodic and sing-song without turning into full pop singing. Choruses are deliberately tiny and repetitive, delivered as a catchy chant with light doubling rather than a huge layered hook. Keep the lead close, dry and intelligible. Use only occasional restrained ad-libs or doubles; avoid constant vocal warping, exaggerated character voices and disruptive effects.
  Arrangement
  [intro]
  Establish the core bass, drum and eerie synth loop immediately but sparsely, leaving pronounced gaps around the fragmented opening vocal. Keep the atmosphere restrained and slightly strange.
  [verse]
  Bring the full established groove into place without adding new instrumentation. Keep the backing repetitive and spacious, allowing the tightly articulated vocal phrasing to provide most of the rhythmic movement.
  [chorus]
  Maintain essentially the same groove. Introduce the short repeated chant with light vocal doubling and a modest increase in bass and drum weight, but avoid turning it into a large pop chorus.
  [verse]
  Return directly to the sparse central loop. Keep the instrumental stable while the vocal becomes denser, quicker and more conversational, with brief ad-libs occupying the spaces between phrases.
  [chorus]
  Restore the established chant essentially unchanged. Preserve its repetition and familiarity rather than increasing the scale.
  [verse]
  Maintain the same central groove while the tongue-twisting vocal patterns become increasingly intricate. Keep the beat relaxed underneath the faster articulation and preserve clear empty space around the lead.
  [chorus]
  Repeat the established chorus with the same restrained doubling and modest rhythmic reinforcement.
  [verse]
  Keep the instrumental loop stubbornly stable while the vocal complexity increases further. Allow increasingly compressed phrasing, rapid consonants and call-and-response ad-libs to create the sense of acceleration without changing the underlying tempo.
  [chorus]
  Return once more to the familiar chant with minimal variation, providing a simple rhythmic reset before the final escalation.
  [verse]
  Treat the final extended verse as the vocal and rhythmic climax. Begin over the established sparse groove, then progressively tighten the vocal spacing as the multi-syllabic words and repeated place names accumulate. Allow the delivery to become increasingly rapid and relentless while keeping articulation clear. The drums may gain slightly stronger hi-hat activity and percussion toward the end, but the core bass and eerie synth loop should remain unchanged. Avoid a dramatic drop or large instrumental build; the escalating vocal itself should create the climax.
  [outro]
  Strip the groove back slightly beneath the final short nonsense-word permutations. Return to the loose, playful spacing of the opening, using minimal bass, percussion and the established synth motif. End abruptly and simply after the final vocal response rather than building toward a conventional musical resolution.
