lyrics: |
  [Intro]
  Mulți oameni vor să mă vadă căzut
  Cu ochii pe mine, dar eu am trecut
  Dumnezeu știe ce am în sufletul meu
  Și cine-mi dorește răul mereu
  [Chorus]
  Many men
  Many, many, many, many men
  Wish death upon me
  Doamne, nu mai plâng deloc
  Nu mai caut cerul-n loc
  Ai milă de mine
  Many men
  Many, many, many, many men
  Wish death upon me

  Ai milă de sufletul meu
  Lumea m-a făcut mai greu
  Wish death upon me

  [Verse 1]

  Vor să mă vadă la pământ, fără bani și fără nume
  Dar când intru-n restaurant se întoarce toată lumea
  Au pus vorbe, au pus invidie
  Au vrut să-mi fure bucurie

  Eu eram diamant ascuns
  Sub noroi și sub apus
  N-au crezut că voi ajunge
  Unde astăzi am ajuns

  Ridic paharul pentru viață
  Pentru frații care-au stat
  Când mulți mi-au dorit sfârșitul
  Eu mai tare m-am ridicat

  [Chorus]

  Many men
  Many, many, many, many men
  Wish death upon me

  Doamne, nu mai plâng deloc
  Nu mai caut cerul-n loc
  Ai milă de mine

  Ai milă de sufletul meu
  Inima s-a făcut greu
  Ai milă de mine

  Many men
  Many, many, many, many men
  Wish death upon me

  [Bridge]

  Toți vorbesc când urci prea sus
  Toți dispar când e de dus
  Dar eu merg pe drumul meu
  Cu Dumnezeu

  [Final Chorus]

  Many men
  Many, many, many, many men
  Wish death upon me

  Dar încă sunt aici
  Încă respir și încă zic
  Doamne, ai milă de mine
