caption: |
  Genre: 2000s alternative hip-hop with restrained gospel influences. Exactly 96 BPM, A minor, natural minor scale, 4/4 throughout. Dark, sparse verses and a fuller melodic chorus that remains in A minor. No tempo changes, no key changes, no disco, no dance-pop and no four-on-the-floor rhythm.
  Vocals: One young adult male lead throughout. Close-miked, dry, rhythmic rap delivery in the verses and a controlled melodic delivery in the chorus. A male gospel choir appears only during the pre-chorus and chorus as supporting harmony. Maintain the same lead-vocal identity throughout. No female vocals, no alternate lead singer and no spoken narration.
  Arrangement: Four-bar piano and electronic-violin intro. Verses use a sparse hip-hop kick and snare, closed hi-hat, sub-bass and low analog-synth pulse. Pre-chorus adds quiet male choir harmonies. Chorus retains the same tempo and drum groove while adding strings, wider choir harmonies and a stronger bass line. Verse two returns to the sparse arrangement. Final chorus repeats the established chorus melody and arrangement. Eight-bar outro with piano, choir and violin, ending cleanly without a long instrumental extension.
