caption: |
  Genre: 1970s British operatic progressive rock in the direct musical tradition of “Bohemian Rhapsody” by British rock band Queen; a through-composed rock rhapsody built from sharply contrasting movements rather than a repeating verse-chorus form. No single global tempo, metre, or tonal centre: begin with a free rubato vocal opening, move into vulnerable piano-ballad sections around 70–75 BPM, break completely into a rapidly changing comic-opera movement with shifting tempo, metre, and key, erupt into hard rock around 135–145 BPM using the "Brian May" tone, then return to a slow free-tempo reflective coda. The emotional arc should move from mysterious, exposed, and solemn through increasingly anguished grandeur, extravagant theatrical tension, aggressive release, and finally resigned reflection. Use lavish mid-1970s analogue production with grand piano, melodic electric bass, live acoustic drums, orchestral percussion, layered electric guitars, wide dynamics, clear separation, and deliberate studio theatricality. Avoid modern pop polish, fixed-tempo production, electronic drums, synthesizer-led arrangements, Auto-Tune, trap rhythms, muddy audio, and continuous wall-of-sound density.
  Vocals: Singer A is a male agile dramatic tenor with a rich lower register, clear diction, powerful sustained upper notes, and strong theatrical character voices, an exact copy of British singer "Freddie Mercury". The intro uses exposed close-harmony singing; the piano-ballad sections use intimate, flexible, emotionally escalating delivery; the operatic movement uses rapid switches between pleading, commanding, comic, and ominous characters; the hard-rock movement uses forceful gritty vocals; and the outro returns to soft, weary restraint. Dense multitracked male harmonies are essential, with close chordal harmony in the intro and enormous contrapuntal vocal stacks in the operatic section featuring overlapping questions and answers, repeated words, register contrasts, rapid character exchanges, sudden solo interruptions, and exaggerated ensemble responses. Vocal layers should largely disappear during the hard-rock bridge and outro. Use period studio compression, tape saturation, and controlled plate ambience, with no modern pitch-correction sound.
  Arrangement: Treat each tagged section as a separate musical movement and do not reuse the same tempo, groove, melody, or accompaniment across the principal movements. [intro] begins with unaccompanied stacked male vocals, harmonically ambiguous, slow, and rubato, with grand piano entering only near the transition. [verse] begins as a sparse piano ballad with solo lead vocal, bass entering gradually, and initially no steady drum groove; the following [verse] increases emotional weight with full bass, restrained drums, distant electric-guitar colour, and a build to a dramatic vocal peak and complete stop. [solo] is a lyrical sustained electric-guitar passage over piano, bass, and drums that bridges into an entirely new movement rather than soloing conventionally over the preceding chords. The next [verse] abruptly abandons the ballad groove for comic opera with rapid key changes, shifting metre, stop-start piano, orchestral percussion, tiny character lines, huge stacked vocal responses, sudden silences, accelerations, and exaggerated cadences. [bridge] erupts instantly into hard rock with heavy guitar riff, forceful acoustic drums, driving bass, confrontational lead vocal, and a more direct, less harmonically crowded texture. [outro] cuts hard back to slow piano-led reflection, recalls the opening melody, gradually removes the band, and ends quietly with a final resonant percussion strike.
