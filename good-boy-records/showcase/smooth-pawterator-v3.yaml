caption: |
  Global Metadata: Target tempo: approximately 100 BPM. Target tonal centre: B minor. Target metre: 4/4. Genre and sonic identity: understated and elegant, 80s sophisti-soul, and restrained dynamics. Emotional arc: smooth sophisti-pop quiet storm and romantic and cool. Rhythmic character: soft brushed groove should define the pocket and motion. Production profile: favour polished analog-digital 1980s studio sound, with the mix and spatial character appropriate to the stated era. Vocal Details: Base the lead and supporting vocal treatment on sultry breathy female vocals and intimate close vocal. Keep lead, backing, choir, spoken, and character roles clearly separated, and use vocal effects only where they serve the stated style. Arrangement: Follow the lyric-section timeline Intro → Verse 1 → Chorus → Verse 2 → Bridge → Outro. Section directives: Intro: soft sax, mellow; Verse 1: smooth, breathy; Chorus: understated groove; Verse 2: laid-back; Bridge: sultry sax break; Outro: fading, smooth. Instrument lifecycle: mellow jazzy electric piano and smooth saxophone should enter, recede, and return as one evolving arrangement rather than remain as a static stack. Shape transitions through changes in density, register, articulation, percussion, and ambience so the energy curve remains clearly audible. Explicit exclusions: avoid disco, funk, slap bass, synthwave, trap, EDM, rock guitar, powerful belting, gospel choir, busy percussion, aggressive drums. Keep melodic, harmonic, and rhythmic motifs recognisable across repeated sections, but vary orchestration and intensity enough that later returns feel developed rather than copied. Preserve natural dynamics and believable ensemble interaction, and let the arrangement breathe around the lead performance instead of filling every register continuously.
lyrics: |
  [Intro]
  (Woof, soft)
  Mmm... two goldens...

  [Verse 1]
  She moves through the room like she's made out of silk
  Cool as the morning, calm as the milk
  She won't chase a thing,
  what she wants, It comes to her
  A golden-eyed lady, with that regal glow

  [Chorus]
  She's a smooth paw-ter-arator, running your home
  Cool little princess on her velvet throne
  And her chunk's all heart, all sunshine and sway
  Two goldens, one home, at the end of the day
  (mmm)

  [Verse 2]
  He's a big gentle giant with a mouth soft and wide
  Loves every stranger, takes them all in his stride
  But Teddy, sweet Teddy, he just cannot abide
  And nobody knows what he's feeling inside

  [Bridge]
  Two sides of a golden, one cool and one warm
  She's the calm in the quiet, he's the joy in the storm
  (soft) Doja... Bam Bam...

  [Outro]
  Two goldens, one home, and they've got it all
  (whispered) Go on... fetch the ball...
  (Woof)
