caption: |
  Genre and sonic identity: sophisticated soul funk, disco-funk, and extended funk vamp. Emotional arc: 1970s psychedelic funk and witty theatrical performance. Rhythmic character: playful stop-start arrangement and seductive groove should define the pocket and motion. Production profile: favour psychedelic phaser effects, warm analog tape saturation, vintage studio production, and rich live instrumentation, with the mix and spatial character appropriate to the stated era. Vocal Details: Base the lead and supporting vocal treatment on charismatic female soul vocals, silky confident lead vocal, playful spoken character vocals, male and female call-and-response, and stacked soul backing harmonies. Treat lyric control tags such as Female, Male, Backing Vocals, Bam Bam, and Doja as explicit performer or delivery changes; recurring named or gendered voices should remain recognisably stable. Keep lead, backing, choir, spoken, and character roles clearly separated, and use vocal effects only where they serve the stated style. Arrangement: Follow the lyric-section timeline Intro → Verse 1 → Pre-Chorus → Chorus → Verse 2 → Verse 2B → Chorus → Instrumental → Bridge → Instrumental → Chorus → Outro. Section directives: Intro: wah-wah guitar, clavinet, deep syncopated bass; Intro: Female Spoken Vocal; Intro: Pitched Male Voice; Intro: Groove Drops; Verse 1: silky female soul vocal; Pre-Chorus: strings and horns enter; Chorus: lush female harmonies, brass hits; Verse 2: bass-led funk groove; Verse 2: Bam Bam - enthusiastic male spoken vocal; Verse 2: Horn Break; Verse 2B: male/female call and response; Verse 2B: Music Stops; Verse 2B: Full Band Hit; Instrumental: wah guitar and clavinet trading solos; Bridge: psychedelic breakdown, phaser, dreamy strings; Bridge: Doja - soft; Instrumental: Bass Break; Final Chorus: full horns, strings, stacked soul vocals; Outro: vamp bass, clavinet, wah guitar. Instrument lifecycle: deep syncopated electric bass, funky wah-wah guitar, clavinet groove, Rhodes electric piano, tight acoustic drums, hand percussion, punchy brass section, and sweeping orchestral strings should enter, recede, and return as one evolving arrangement rather than remain as a static stack. Shape transitions through changes in density, register, articulation, percussion, and ambience so the energy curve remains clearly audible. Explicit exclusions: avoid modern disco house, EDM, synthwave, 1980s synth-funk, trap drums, 808 bass, rock distortion, digital production, aggressive modern compression.
lyrics: |
  [Intro]

  [Female]
  Mm.

  You can sit there.

  Not there.

  That's my spot.

  [Male]
  Doja...

  [Female]
  Paws off.

  [Verse 1]
  Golden in the doorway
  Sunlight on my hair
  Everybody looking
  Like I wouldn't know they're there

  I don't need your calling
  I don't come for free
  If you want some golden loving
  Bring an offering to me

  Scratch a little higher
  Maybe to the right
  Keep it going, human
  You might earn your place tonight

  [Backing Vocals]
  Paws off!
  Unless she says so!

  [Female]
  That's right.

  [Pre-Chorus]
  I got four paws
  One crown
  Whole house
  Locked down

  If you're wondering who owns it

  Baby, look around

  [Chorus]
  Paws off the velvet
  That's the princess's chair

  Paws off the velvet
  Don't you put your body there

  I might want attention
  I might want to be alone

  Either way the simple fact is

  Everything I see I own

  [Backing Vocals]
  Everything!

  [Female]
  Everything.

  [Verse 2]
  Then I hear a rumble
  Coming down the hall
  Here comes Mister Bam Bam
  With his favourite tennis ball

  Big lips
  Wet face
  Absolutely no grace

  Hit the corner sideways
  Nearly rearranged my place

  [Bam Bam]
  Doja!

  [Doja]
  No.

  [Bam Bam]
  Ball?

  [Doja]
  No.

  [Bam Bam]
  Mama?

  [Doja]
  Maybe.

  [Bam Bam]
  BALL?

  [Doja]
  Good lord.

  [Verse 2B]
  [Bam Bam]
  I got love for everybody!

  [Doja]
  We know.

  [Bam Bam]
  I got places I can go!

  [Doja]
  Then go.

  [Bam Bam]
  Throw it to the garden
  I'll retrieve it through the snow!

  [Doja]
  Just don't bring Teddy.

  [Bam Bam]
  Fluff Teddy.

  [Chorus]
  Paws off the velvet
  That's the princess's chair

  Paws off the velvet
  There's enough Bam Bam everywhere

  One of us has standards
  One's a hurricane of gold

  [Backing Vocals]
  Which is which?

  [Doja]
  If you have to ask
  You're not as clever as I'm told

  [Instrumental]

  [Bridge]
  [Doja]
  Sometimes when the lights go down
  And everybody's sleeping
  I hear him dreaming by the door
  His giant paws still leaping

  And maybe he's an idiot
  And maybe he's obscene

  But every proper princess
  Needs a slobber-covered team

  [Backing Vocals]
  Awwww...

  [Doja]
  Don't make this weird.

  [Instrumental]

  [Chorus]
  Paws off the velvet
  Let the golden people through

  Paws off the velvet
  Unless I've summoned you

  Mama's got the treat bag
  Bam Bam's got the ball

  I've got every single chair
  So who's really got it all?

  [Backing Vocals]
  DOJA!

  [Doja]
  Correct.

  [Outro]

  Paws off
  Paws off
  P-p-p-paws off

  [Bam Bam]
  Ball!

  Paws off
  Paws off
  Keep your paws off

  [Bam Bam]
  Ball!

  [Doja]
  Somebody throw it before he explodes.

  [Backing Vocals]
  Paws off!

  [Doja]
  Woof.
