caption: |
  1950s doo-wop, retro soul, 6/8 triplet sway, sweet group harmony backing vocals, finger snaps, warm tremolo guitar, vintage tape, playful sassy female lead, malt-shop nostalgia
lyrics: |
  [Intro - group harmony, finger snaps]
  (group) Sha-la-la... doo-wop...
  (Woof)
  Oh, two little goldens...

  [Verse 1 - sweet lead, group answers]
  There's a golden girl with a cold little stare (ooh-ooh)
  Copper-coated princess and she hasn't a care (sha-la-la)
  She won't chase the ball, no, she's much too refined
  The prettiest, pettiest golden you'll find

  [Chorus - sweet group harmony, sway]
  Two goldens (doo-wop) one little home (bom-bom)
  One is a princess on her velvet throne (sha-la-la)
  One is a sweetheart, all slobber and sun (ooh-ooh)
  Two golden hearts beating, two beating as one
  (Woof)

  [Verse 2 - lead, group fills]
  Here's her big chunk with the heart open wide (ooh-ooh)
  One thought, go fetch, and he's off on the ride (bom-bom)
  He loves every soul that he ever did see
  But Teddy, oh Teddy, no friend will he be (why-y-y?)

  [Bridge - dreamy, harmonized]
  Two sides of a golden, one heart down below (ahhh)
  She's the brains and the beauty, he's the heart and the glow
  (group) Doo-wop... Doja... Bam Bam...

  [Outro - ritard, harmony]
  Two goldens, one home, and they have it all (sha-la-la)
  (slowing) Go on, sweethearts... fetch the ball...
  (group) Bom... bom... (Woof)
