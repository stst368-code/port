caption: |
  Genre 2000s United States of America Christian-choir-hip-hop, directed by a local church pastor and sung by his young white male students of Christian faith. 90 to 140 BPM range. Natural harmonic minor scales, either A minor, E minor or C minor, in 4/4 timing. Urgent minor-key verses, bright melodic chorus, upbeat and confident delivery. Studio production, with the mix and spatial character appropriate to the stated era.
  Vocals Christian church choir, all white, all male choir singing, a Christian choir type hip-hop style, lead vocals and rich stacked harmonies. Keep lead, backing, choir, spoken, and character roles clearly separated, and use vocal effects only where they serve the stated style. 
  Arrangement Analog synthesizer, string ensemble, piano, electric bass, disco drums, crisp hi-hat, electronic violin.Production: Dynamic transitions, shifting density, altered registers, heavy ambience.[Intro] Ambient piano and a dramatic electronic violin decrescendo.[Verse 1] Hypnotic analog synthesizer arpeggio enters with a melodic electric bass. Low percussion density.[Chorus] High energy curve. Tight four-on-the-floor disco drums and crisp hi-hats enter simultaneously with the full string ensemble.[Verse 2] Instruments recede. The arrangement thins down to a tight drum pattern and a lower-register piano articulation.[Outro] Instruments return as one evolving arrangement before fading out.
